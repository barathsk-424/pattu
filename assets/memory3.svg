<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <!-- "Starry nights with you" — a bench under the moon above the city -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#120A3A"/>
      <stop offset="0.6" stop-color="#43207A"/>
      <stop offset="1" stop-color="#C45A9A"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFF3D6" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#FFF3D6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="trail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFF" stop-opacity="0"/>
      <stop offset="1" stop-color="#FFF" stop-opacity="0.9"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#sky)"/>
  <g fill="#FFF">
    <circle cx="80" cy="60" r="1.8"/><circle cx="210" cy="120" r="1.3"/><circle cx="360" cy="50" r="1.6"/>
    <circle cx="300" cy="190" r="1.1"/><circle cx="480" cy="140" r="1.4"/><circle cx="120" cy="230" r="1.2"/>
    <circle cx="700" cy="250" r="1.2"/><circle cx="740" cy="60" r="1.5"/><circle cx="430" cy="240" r="1"/>
  </g>
  <!-- shooting star -->
  <line x1="150" y1="80" x2="300" y2="140" stroke="url(#trail)" stroke-width="3" stroke-linecap="round"/>
  <circle cx="300" cy="140" r="3.5" fill="#FFF"/>
  <!-- crescent moon -->
  <circle cx="610" cy="140" r="120" fill="url(#moonGlow)"/>
  <mask id="crescent">
    <rect width="800" height="600" fill="#FFF"/>
    <circle cx="636" cy="122" r="56" fill="#000"/>
  </mask>
  <circle cx="610" cy="140" r="62" fill="#FFF3D6" mask="url(#crescent)"/>
  <!-- city skyline -->
  <g fill="#24104A">
    <rect x="0" y="360" width="70" height="140"/><rect x="60" y="320" width="50" height="180"/>
    <rect x="110" y="380" width="80" height="120"/><rect x="185" y="300" width="45" height="200"/>
    <rect x="230" y="350" width="70" height="150"/><rect x="300" y="390" width="60" height="110"/>
    <rect x="470" y="370" width="60" height="130"/><rect x="525" y="310" width="50" height="190"/>
    <rect x="575" y="360" width="75" height="140"/><rect x="645" y="330" width="55" height="170"/>
    <rect x="700" y="380" width="100" height="120"/>
  </g>
  <g fill="#F5D58A" opacity="0.75">
    <rect x="72" y="340" width="6" height="8"/><rect x="90" y="370" width="6" height="8"/><rect x="200" y="320" width="6" height="8"/>
    <rect x="212" y="360" width="6" height="8"/><rect x="250" y="370" width="6" height="8"/><rect x="540" y="330" width="6" height="8"/>
    <rect x="556" y="380" width="6" height="8"/><rect x="600" y="380" width="6" height="8"/><rect x="660" y="350" width="6" height="8"/>
    <rect x="676" y="400" width="6" height="8"/><rect x="140" y="400" width="6" height="8"/><rect x="730" y="400" width="6" height="8"/>
  </g>
  <!-- hilltop -->
  <path d="M0 500 Q400 430 800 500 L800 600 L0 600Z" fill="#12082A"/>
  <!-- lamp post -->
  <rect x="560" y="380" width="6" height="110" fill="#12082A"/>
  <circle cx="563" cy="376" r="40" fill="#FFE3A8" opacity="0.18"/>
  <circle cx="563" cy="378" r="9" fill="#FFE3A8"/>
  <!-- bench + couple -->
  <g fill="#12082A">
    <rect x="320" y="440" width="170" height="10" rx="3"/>
    <rect x="320" y="420" width="170" height="8" rx="3"/>
    <rect x="330" y="450" width="8" height="34"/><rect x="472" y="450" width="8" height="34"/>
    <circle cx="380" cy="380" r="17"/>
    <path d="M356 442 Q356 404 380 400 Q402 402 406 442Z"/>
    <circle cx="420" cy="383" r="16"/>
    <path d="M400 442 Q402 408 422 404 Q444 406 446 442Z"/>
  </g>
  <path d="M400 360 C390 352 392 342 400 347 C408 342 410 352 400 360Z" fill="#FF8FB1"/>
</svg>
