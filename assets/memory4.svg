  <ellipse cx="400" cy="505" rx="190" ry="24" fill="#F3E6FF"/>
  <rect x="245" y="400" width="310" height="100" rx="18" fill="url(#tier1)"/>
  <path d="M245 412 Q270 440 295 412 Q320 440 345 412 Q370 440 395 412 Q420 440 445 412 Q470 440 495 412 Q520 440 555 412 L555 405 Q555 400 545 400 L255 400 Q245 400 245 405Z" fill="#F3E6FF"/>
  <rect x="290" y="320" width="220" height="88" rx="16" fill="url(#tier2)"/>
  <path d="M290 332 Q312 356 334 332 Q356 356 378 332 Q400 356 422 332 Q444 356 466 332 Q488 356 510 332 L510 326 Q510 320 500 320 L300 320 Q290 320 290 326Z" fill="#FFF6F0"/>
  <g fill="#F5D58A">
    <circle cx="320" cy="455" r="6"/><circle cx="400" cy="460" r="6"/><circle cx="480" cy="455" r="6"/>
    <circle cx="350" cy="372" r="5"/><circle cx="450" cy="372" r="5"/>
  </g>
  <path d="M400 385 C385 373 388 360 400 367 C412 360 415 373 400 385Z" fill="#FFF"/>
