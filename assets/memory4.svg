    <rect x="443" y="270" width="12" height="52" rx="4" fill="#E9D3F5"/>
    <circle cx="351" cy="252" r="26" fill="url(#glow)"/><circle cx="400" cy="240" r="26" fill="url(#glow)"/><circle cx="449" cy="252" r="26" fill="url(#glow)"/>
    <path d="M351 266 C342 256 348 244 351 236 C354 244 360 256 351 266Z" fill="url(#flame)"/>
    <path d="M400 254 C391 244 397 232 400 224 C403 232 409 244 400 254Z" fill="url(#flame)"/>
    <path d="M449 266 C440 256 446 244 449 236 C452 244 458 256 449 266Z" fill="url(#flame)"/>
