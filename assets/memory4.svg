<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <!-- "Every birthday with you" — cake, balloons and confetti -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2A0E55"/>
      <stop offset="0.6" stop-color="#7A2E8F"/>
      <stop offset="1" stop-color="#F28CA8"/>
    </linearGradient>
    <linearGradient id="tier1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A67FE8"/><stop offset="1" stop-color="#5B21B6"/>
    </linearGradient>
    <linearGradient id="tier2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFB8D0"/><stop offset="1" stop-color="#E26A95"/>
    </linearGradient>
    <radialGradient id="flame" cx="0.5" cy="0.7" r="0.6">
      <stop offset="0" stop-color="#FFFDE7"/><stop offset="0.5" stop-color="#FFC94F"/><stop offset="1" stop-color="#FF7A1A"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFD27A" stop-opacity="0.55"/><stop offset="1" stop-color="#FFD27A" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <!-- confetti -->
  <g>
    <rect x="80" y="70" width="12" height="6" fill="#F5D58A" transform="rotate(30 86 73)"/>
    <rect x="200" y="140" width="12" height="6" fill="#FFB8D0" transform="rotate(-20 206 143)"/>
    <rect x="640" y="90" width="12" height="6" fill="#A5F3FC" transform="rotate(45 646 93)"/>
    <rect x="720" y="220" width="12" height="6" fill="#F5D58A" transform="rotate(-35 726 223)"/>
    <rect x="300" y="60" width="12" height="6" fill="#C9B0F5" transform="rotate(15 306 63)"/>
    <rect x="520" y="50" width="12" height="6" fill="#FF8FB1" transform="rotate(-50 526 53)"/>
    <circle cx="140" cy="260" r="5" fill="#F5D58A"/><circle cx="680" cy="330" r="5" fill="#FFB8D0"/>
    <circle cx="420" cy="90" r="4" fill="#A5F3FC"/><circle cx="60" cy="380" r="4" fill="#C9B0F5"/>
  </g>
  <!-- balloons -->
  <g>
    <path d="M140 300 Q150 380 175 470" stroke="#F3E6FF" stroke-width="2" fill="none" opacity="0.6"/>
    <ellipse cx="140" cy="250" rx="48" ry="58" fill="#A67FE8"/>
    <ellipse cx="124" cy="230" rx="12" ry="18" fill="#FFF" opacity="0.35"/>
    <path d="M90 360 Q110 420 160 480" stroke="#F3E6FF" stroke-width="2" fill="none" opacity="0.6"/>
    <ellipse cx="90" cy="320" rx="38" ry="46" fill="#FF8FB1"/>
    <path d="M660 290 Q650 380 625 470" stroke="#F3E6FF" stroke-width="2" fill="none" opacity="0.6"/>
    <ellipse cx="660" cy="240" rx="48" ry="58" fill="#F5D58A"/>
    <ellipse cx="644" cy="220" rx="12" ry="18" fill="#FFF" opacity="0.4"/>
    <path d="M715 350 Q700 420 640 480" stroke="#F3E6FF" stroke-width="2" fill="none" opacity="0.6"/>
    <path d="M715 350 C665 315 675 260 715 285 C755 260 765 315 715 350Z" fill="#FF6F9C"/>
  </g>
  <!-- table -->
  <ellipse cx="400" cy="520" rx="300" ry="40" fill="#1E0838" opacity="0.6"/>
