<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B0B3D"/>
      <stop offset="0.55" stop-color="#6B2A8C"/>
      <stop offset="1" stop-color="#F28CA8"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFF6D8" stop-opacity="0.9"/>
      <stop offset="0.45" stop-color="#FFD9A0" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FFD9A0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="heartGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FF8FB1" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#FF8FB1" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="600" fill="url(#sky)"/>
  <!-- stars -->
  <g fill="#FFF">
    <circle cx="70" cy="80" r="2"/><circle cx="150" cy="40" r="1.5"/><circle cx="520" cy="70" r="2"/>
    <circle cx="460" cy="140" r="1.4"/><circle cx="90" cy="190" r="1.3"/><circle cx="545" cy="210" r="1.6"/>
    <circle cx="230" cy="110" r="1.2"/><circle cx="380" cy="60" r="1.5"/><circle cx="40" cy="300" r="1.2"/>
    <circle cx="570" cy="320" r="1.3"/><circle cx="200" cy="230" r="1"/><circle cx="420" cy="250" r="1"/>
  </g>
  <path d="M480 100 l4 10 l10 4 l-10 4 l-4 10 l-4 -10 l-10 -4 l10 -4z" fill="#FFE9A8"/>
  <path d="M110 130 l3 7 l7 3 l-7 3 l-3 7 l-3 -7 l-7 -3 l7 -3z" fill="#FFE9A8"/>
  <!-- moon -->
  <circle cx="300" cy="250" r="190" fill="url(#moonGlow)"/>
  <circle cx="300" cy="250" r="110" fill="#FFF3D6"/>
  <circle cx="265" cy="220" r="16" fill="#F5E2B8" opacity="0.7"/>
  <circle cx="335" cy="285" r="22" fill="#F5E2B8" opacity="0.6"/>
  <circle cx="330" cy="205" r="9" fill="#F5E2B8" opacity="0.7"/>
  <!-- hills -->
  <path d="M0 470 Q160 400 300 430 Q450 460 600 410 L600 600 L0 600Z" fill="#3A1452"/>
  <path d="M0 520 Q300 420 600 520 L600 600 L0 600Z" fill="#1A0A2E"/>
  <!-- couple silhouette sitting, heads leaning together -->
  <g fill="#1A0A2E">
    <circle cx="276" cy="398" r="19"/>
    <path d="M246 486 Q246 428 270 420 Q292 418 300 440 L304 486Z"/>
    <circle cx="322" cy="402" r="18"/>
    <path d="M298 486 L300 444 Q308 422 328 424 Q352 430 354 486Z"/>
    <path d="M304 404 Q322 378 340 400 Q344 420 336 430 Q328 412 318 408Z"/>
  </g>
  <!-- floating heart -->
  <circle cx="299" cy="330" r="46" fill="url(#heartGlow)"/>
  <path d="M299 352 C272 332 276 306 299 318 C322 306 326 332 299 352Z" fill="#FF6F9C"/>
  <path d="M287 322 q4 -6 10 -3" stroke="#FFF" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.7"/>
  <!-- small hearts -->
  <path d="M200 300 C192 294 193 286 200 290 C207 286 208 294 200 300Z" fill="#FFB8D0" opacity="0.8"/>
  <path d="M410 320 C400 312 402 302 410 307 C418 302 420 312 410 320Z" fill="#FFB8D0" opacity="0.8"/>
</svg>
